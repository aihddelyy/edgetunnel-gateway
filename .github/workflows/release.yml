name: Build and Release Go Binaries

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如: 1.0.1 或 v1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Linux Binaries & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Sync Public Assets for //go:embed
        run: |
          mkdir -p pkg/web/public
          cp -r public/* pkg/web/public/

      - name: Build Linux AMD64 Binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o edgetunnel-lb-linux-amd64 ./cmd/server
          chmod +x edgetunnel-lb-linux-amd64

      - name: Build Linux ARM64 Binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o edgetunnel-lb-linux-arm64 ./cmd/server
          chmod +x edgetunnel-lb-linux-arm64

      - name: Generate SHA256 Checksums & Archive
        run: |
          tar -czvf edgetunnel-lb-linux-amd64.tar.gz edgetunnel-lb-linux-amd64 config.example.json
          tar -czvf edgetunnel-lb-linux-arm64.tar.gz edgetunnel-lb-linux-arm64 config.example.json
          sha256sum edgetunnel-lb-linux-amd64 edgetunnel-lb-linux-arm64 edgetunnel-lb-linux-amd64.tar.gz edgetunnel-lb-linux-arm64.tar.gz > sha256sums.txt

      - name: Determine Tag Name
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_VER="${{ github.event.inputs.version }}"
            [[ "$INPUT_VER" != v* ]] && TAG="v$INPUT_VER" || TAG="$INPUT_VER"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=EdgeTunnel LB Release $TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🚀 EdgeTunnel LB (Go 高性能单文件独立版) ${{ steps.vars.outputs.tag }}

            纯 Go 单文件极速独立版，零外部依赖（无需 Node.js / Docker），内存占用仅 ~15MB，原生支持 OpenWrt 软路由与群晖 NAS。

            #### 📦 发布文件
            - `edgetunnel-lb-linux-amd64`：适用于 x86 软路由、群晖 NAS、常规 VPS/服务器
            - `edgetunnel-lb-linux-arm64`：适用于 ARM 架构软路由（NanoPi R4S/R5S、斐讯 N1、树莓派等）
            - `*.tar.gz`：包含二进制与配置文件模板的压缩包
            - `sha256sums.txt`：文件 SHA256 完整性校验值

            #### 快速运行说明
            ```bash
            # 下载并赋权
            chmod +x edgetunnel-lb-linux-amd64
            # 配合 config.json 后台运行
            nohup ./edgetunnel-lb-linux-amd64 -config config.json > app.log 2>&1 &
            ```
          files: |
            edgetunnel-lb-linux-amd64
            edgetunnel-lb-linux-arm64
            edgetunnel-lb-linux-amd64.tar.gz
            edgetunnel-lb-linux-arm64.tar.gz
            sha256sums.txt
