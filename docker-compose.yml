version: '3.8'

services:
  edgetunnel-lb:
    build:
      context: .
      dockerfile: Dockerfile
    image: local-edgetunnel-lb:go-latest
    container_name: local-edgetunnel-lb
    restart: unless-stopped
    network_mode: "host" # Recommended for ultra-low latency & direct port binding on NAS/Linux
    volumes:
      - ./config.json:/app/config.json
      - ./backups:/app/backups
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
